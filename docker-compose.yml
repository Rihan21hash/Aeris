version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeris_db
      POSTGRES_USER: aeris_user
      POSTGRES_PASSWORD: aeris_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeris_user -d aeris_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

